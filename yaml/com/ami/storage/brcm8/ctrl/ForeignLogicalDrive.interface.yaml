description: >
    This defines a foreign logical drive info interface.

properties:
    - name: Id
      type: uint16
      flags:
        - readonly
      description: >
        The logical drive ID.
    - name: State
      type: enum[com.ami.storage.brcm8.Enumerations.LogicalDriveState]
      flags:
        - readonly
      description: >
        The logical drive state.
    - name: PRL
      type: byte
      flags:
        - readonly
      description: >
        The logical drive PRL value.
    - name: RLQ
      type: byte
      flags:
        - readonly
      description: >
        The logical drive RLQ value.
    - name: SRL
      type: byte
      flags:
        - readonly
      description: >
        The logical drive SRL value.
    - name: RAIDType
      type: enum[com.ami.storage.brcm8.Enumerations.LogicalDriveRaidType]
      flags:
        - readonly
      description: >
        Keep tracking the RAID type of this volume.
    - name: BlockSizeBytes
      type: uint64
      flags:
        - readonly
      description: >
        The user data block size of logical device.
    - name: CapacityBytes
      type: uint64
      flags:
        - readonly
      description: >
        The total size in bytes of logical device.

description: >
    This defines a Broadcom RAID controller info

properties:
    - name: Id
      type: uint32
      flags:
        - readonly
      description: >
        Controller ID.
    - name: Model
      type: string
      flags:
        - readonly
      description: >
        Controller model name.
    - name: SerialNumber
      type: string
      flags:
        - readonly
      description: >
        Controller serial number.
    - name: PackageVersion
      type: string
      flags:
        - readonly
      description: >
        Package version.
    - name: PCI
      type: array[struct[uint16, uint16]]
      flags:
        - readonly
      description: >
        The PCI vendor id and device id of this RAID controller.
    - name: PCIBDF
      type: struct[byte, byte, byte]
      flags:
        - readonly
      description: >
        The PCI bus, device and function number of this RAID controller.
    - name: PCILinkSpeed
      type: struct[double, string]
      flags:
        - readonly
    - name: PCIPortWidth
      type: byte
      flags:
        - readonly
    - name: Temperature
      type: struct[int32, string]
      flags:
        - readonly
    - name: BoardTemperature
      type: struct[int32, string]
      flags:
        - readonly
    - name: Status
      type: array[enum[com.ami.storage.brcm8.Enumerations.ControllerStatus]]
      flags:
        - readonly
    - name: PhysicalDriveOperations
      type: array[struct[enum[com.ami.storage.brcm8.Enumerations.PhysicalDriveOperation], boolean]]
      flags:
        - readonly
    - name: LogicalDriveOperations
      type: array[struct[enum[com.ami.storage.brcm8.Enumerations.LogicalDriveOperation], boolean]]
      flags:
        - readonly
    - name: CurrentPersonality
      type: string
      flags:
        - readonly
      description: >
        Current personality ID.
    - name: RequestedPersonality
      type: string
      flags:
        - readonly
      description: >
        Requested personality ID.
    - name: SupportedPersonality
      type: array[string]
      flags:
        - readonly
      description: >
        Supported personality.
    - name: SupportedStripSizeHDD
      type: array[uint64]
      flags:
        - readonly
      description: >
        Supported strip sizes for HDD LDs in bytes.
    - name: SupportedStripSizeSSD
      type: array[uint64]
      flags:
        - readonly
      description: >
        Supported strip sizes for SSD LDs in bytes.
    - name: SupportedStripSizeNVMe
      type: array[uint64]
      flags:
        - readonly
      description: >
        Supported strip sizes for NVMe LDs in bytes.
    - name: SupportMixedSizeWithinArrayHDD
      type: boolean
      flags:
        - readonly
      description: Whether HDD supports mixed strip size within a single array.
    - name: SupportMixedSizeWithinArraySSD
      type: boolean
      flags:
        - readonly
      description: Whether SSD supports mixed strip size within a single array.
    - name: SupportMixedSizeWithinArrayNVMe
      type: boolean
      flags:
        - readonly
      description: Whether NVMe supports mixed strip size within a single array.
    - name: SupportedMaxPdCountOnRAIDType
      type: array[struct[enum[com.ami.storage.brcm8.Enumerations.LogicalDriveRaidType], int32]]
      flags:
        - readonly
      description: >
        Supported maximum physical drive count on each RAID type.
    - name: SupportedMinPdCountOnRAIDType
      type: array[struct[enum[com.ami.storage.brcm8.Enumerations.LogicalDriveRaidType], int32]]
      flags:
        - readonly
      description: >
        Supported minimum physical drive count on each RAID type.
    - name: MemoryCorrectableErrorCount
      type: uint32
      flags:
        - readonly
      description: >
        Number of correctable memory errors - this is a running total (non-persistent)
    - name: MemoryUncorrectableErrorCount
      type: uint32
      flags:
        - readonly
      description: >
        Number of uncorrectable memory errors - this is a running total (persistent)
    - name: SingleBitEccErrorBucketCount
      type: uint32
      flags:
        - readonly
      description: >
        Number of single-bit ECC errors currently in the bucket
    - name: Health
      type: enum[com.ami.storage.brcm8.Enumerations.Health]
      flags:
        - readonly
    - name: ModifiableProperties
      type: array[string]
      flags:
        - readonly
      description: >
        List of modifiable properties for the controller.
    - name: EnableAutoRebuild

description: >
    This defines a BRCM SL8 daemon interface.

methods:
    - name: Message
      description: >
        BRCM daemon command message
      parameters:
        - name: Request
          type: array[byte]
      returns:
        - name: Response
          type: array[byte]
      errors:
        - com.ami.storage.Common.Error.InvalidArgument
        - com.ami.storage.Common.Error.InternalFailure
        - com.ami.storage.Common.Error.DeviceOrResourceBusy

signals:
    - name: MethodCompletedSignal
      description: >
        Signal indicating about the status of async dbus method call.
      properties:
        - name: Identification
          type: uint64
          description: >
            Unique identification of each method call.
        - name: ErrorCode
          type: enum[com.ami.storage.brcm8.Enumerations.ErrorCode]
        - name: What
          type: string
          description: >
            The details about the error.
    - name: CacheChangedSignal
      description: >
        The cached data changed signal.
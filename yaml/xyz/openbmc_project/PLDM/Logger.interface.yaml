description: >
    Implement this to manage PLDM (Platform Level Data Management) logging.

    PLDM logger is responsible for collecting and managing logs related to
    LogLevel and LogType. It is used for debugging and monitoring the PLDM-related
    information in the system.

properties:
    - name: LogLevel
      type: byte
      description: >
          The level of logging detail for the PLDM logger. This value should
          be a 8-bit unsigned integer representing the severity or verbosity
          of the logs.

    - name: LogType
      type: uint32
      description: >
          The type of log being generated by the PLDM logger. This value should
          be a 32-bit unsigned integer that categorizes the log, such as BASE, PLATFORM,
          or OT_EXTENSION-specific logs.

signals:
    - name: LoggerTestSignal
      description: >
          A signal that can be emitted to test the PLDM logger functionality.
          This signal can be used to verify that the logger is operational and
          can handle log messages correctly.
      properties:
          - name: TestCase
            type: byte
            description: >
                A test case identifier for the logger test signal. This value should
                be a byte that specifies which test case is being executed.

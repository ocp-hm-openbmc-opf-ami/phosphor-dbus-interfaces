description: >
    Implementation for PLDM Type 6 (RDE) response messages.
properties:
    - name: CompletionCode
      type: int16
      description: >
          PLDM operation completion code.
    - name: useCache
      type: boolean
      description: >
          Whether to use cache for the response.
    - name: cacheAllowed
      type: byte
      description: >
          Whether the cache is allowed for the response.
    - name: taskSpawned
      type: boolean
      description: >
          Whether the task is spawned.
    - name: AllowedMethods
      type: byte
      description: >
          PermissionFlags.
          Indicates the access level granted to the resource targeted by the Operation.
          [7:6] - reserved for future use
          [5] - head access; 1b = access allowed
          [4] - delete access; 1b = access allowed
          [3] - create access; 1b = access allowed
          [2] - replace access; 1b = access allowed
          [1] - update access; 1b = access allowed
          [0] - read access; 1b = access allowed
    - name: SchemaForm
      type: string
      description: >
          The schema URI of major schema dictionary.
    - name: ETag
      type: string
      description: >
          The ETag value of the resource.
    - name: ResponseBody
      type: string
      description: >
          The response body of the operation.

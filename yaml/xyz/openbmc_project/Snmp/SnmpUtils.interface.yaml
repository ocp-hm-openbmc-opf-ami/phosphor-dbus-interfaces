description: >
methods:
    - name: SendSNMPTrap
      description: >
          Test SNMP Trap
      errors:
          - xyz.openbmc_project.Common.Error.NotAllowed
      returns:
          - name: success
            type: boolean
            description: >
                Indicates if successful or not
    - name: ListSNMPCommunityProfile
      description: >
          List SNMP Community Profile
      errors:
          - xyz.openbmc_project.Common.Error.NotAllowed
          - xyz.openbmc_project.Common.Error.Unavailable
      returns:
          - name: communityProfiles
            type: array[string]
            description: >
                List of SNMP community profiles

properties:
    - name: SnmpProtocolStatus
      type: boolean
      description: >
            if SnmpProtocolStatus is true, snmpd daemon also set to true and vice versa. if SnmpProtocolStatus false then all SNMP properties are manually set with false.
      errors:
          - xyz.openbmc_project.Common.Error.Unavailable

    - name: SnmpTrapStatus
      type: boolean
      description: >
            if true SnmpTrap is enable else SnmpTrap is disable and set to false while SnmpProtocolStatus disabling
      errors:
          - xyz.openbmc_project.Common.Error.Unavailable

    - name: EnableSNMPV1
      type: boolean
      description: >
            if true SnmpTrap is enable else SnmpTrap is disable and set to false while SnmpProtocolStatus disabling
      errors:
          - xyz.openbmc_project.Common.Error.Unavailable

    - name: EnableSNMPV2
      type: boolean
      description: >
            if true SnmpTrap is enable else SnmpTrap is disable and set to false while SnmpProtocolStatus disabling
      errors:
          - xyz.openbmc_project.Common.Error.Unavailable

    - name: EnableSNMPV3
      type: boolean
      description: >
            if true SnmpTrap is enable else SnmpTrap is disable and set to false while SnmpProtocolStatus disabling
      errors:
          - xyz.openbmc_project.Common.Error.Unavailable


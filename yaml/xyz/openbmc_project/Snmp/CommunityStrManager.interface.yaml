description: >
    This defines the network endpoint. Application which wants to keep the
    network endpoint info can use this interface. e.g: Network endpoint could be
    SNMP managers or LDAP servers etc.
properties:
    - name: CommunityString
      type: string
      description: >
          The value of this property is the SNMP V1 and v2 community string name
      errors:
          - xyz.openbmc_project.Common.Error.InternalFailure
          - xyz.openbmc_project.Common.Error.InvalidArgument
    - name: ReadWritePermission
      type: string
      description: >
          Read write permission for the specific community string.
      errors:
          - xyz.openbmc_project.Common.Error.InvalidArgument
          - xyz.openbmc_project.Common.Error.InternalFailure
    - name: CommunityProfile
      type: string
      description: >
          SNMP community profile to give specific permission.
      errors:
          - xyz.openbmc_project.Common.Error.InvalidArgument
          - xyz.openbmc_project.Common.Error.InternalFailure

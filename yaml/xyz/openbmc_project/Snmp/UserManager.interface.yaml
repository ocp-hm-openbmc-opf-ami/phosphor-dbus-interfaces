description: >
    This defines the network endpoint. Application which wants to keep the
    network endpoint info can use this interface. e.g: Network endpoint could be
    SNMP managers or LDAP servers etc.
properties:
    - name: UserName
      type: string
      description: >
          SNMP Username for the internal user which has been already created.
      errors:
          - xyz.openbmc_project.Common.Error.InvalidArgument
          - xyz.openbmc_project.Common.Error.InternalFailure
    - name: Password
      type: string
      description: >
          SNMP Username for the internal user which has been already created.
      errors:
          - xyz.openbmc_project.Common.Error.InvalidArgument
          - xyz.openbmc_project.Common.Error.InternalFailure
    - name: Encryption
      type: string
      description: >
          SNMP Encryption type V3 user.
      errors:
          - xyz.openbmc_project.Common.Error.InvalidArgument
          - xyz.openbmc_project.Common.Error.InternalFailure
    - name: Algorithm
      type: string
      description: >
          SNMP Algorithm type V3 user.
      errors:
          - xyz.openbmc_project.Common.Error.InternalFailure
          - xyz.openbmc_project.Common.Error.InvalidArgument
    - name: ReadWritePermission
      type: string
      description: >
          The value of this property is the Read write permission for SNMP V1 and v2 community string name.
      errors:
          - xyz.openbmc_project.Common.Error.InvalidArgument
          - xyz.openbmc_project.Common.Error.InternalFailure

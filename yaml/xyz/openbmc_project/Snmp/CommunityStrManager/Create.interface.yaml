description: >
methods:
    - name: Client
      description: >
          Create network client endpoint.
      parameters:
          - name: CommunityString
            type: string
            description: >
                The value of this property is the SNMP V1 and v2 community string name
          - name: ReadWritePermission
            type: string
            description: >
                Read write permission for the specific community string
          - name: CommunityProfile
            type: string
            description: >
                SNMP community profile to give specific permission.
      errors:
          - xyz.openbmc_project.Common.Error.InvalidArgument
      returns:
          - name: path
            type: string
            description: >
                Path of the object which has been created.

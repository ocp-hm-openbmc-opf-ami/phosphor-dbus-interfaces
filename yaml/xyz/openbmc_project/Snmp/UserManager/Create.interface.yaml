description: >
methods:
    - name: Client
      description: >
          Create network client endpoint.
      parameters:
          - name: UserName
            type: string
            description: >
                SNMP Username for the internal user which has been already created.
          - name: Password
            type: string
            description: >
                SNMP Username for the internal user which has been already created.
          - name: Encryption
            type: string
            description: >
                SNMP Encryption type V3 user.
          - name: Algorithm
            type: string
            description: >
                SNMP Algorithm type V3 User.
          - name: ReadWritePermission
            type: string
            description: >
                The value of this property is the Read write permission for SNMP V1 and v2 community string name
      errors:
          - xyz.openbmc_project.Common.Error.InvalidArgument
      returns:
          - name: path
            type: string
            description: >
                Path of the object which has been created.

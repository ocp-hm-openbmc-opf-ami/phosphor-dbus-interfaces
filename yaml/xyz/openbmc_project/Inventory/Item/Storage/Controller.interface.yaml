description: >
    Implement to provide Controllers attributes.
properties:
    - name: Name
      type: string
      flags:
          - readonly
      description: >
          The name of the resource or array member.
    - name: Id
      type: string
      flags:
          - readonly
      description: >
          The unique identifier for this resource within the 
          collection of similar resources.
    - name: Description
      type: string
      flags:
          - readonly
      description: >
          Implementation form for the Volumes..
    - name: State
      type: string
      flags:
          - readonly
      description: >
          The State of the Storage Device.
    - name: Health
      type: string
      flags:
          - readonly
      description: >
          Health of the Storage Device.
    - name: SpeedGbps
      type: double
      flags:
          - readonly
      description: >
          The maximum speed of the storage controller's device interface.
    - name: FirmwareVersion
      type: string
      flags:
          - readonly
      description: >
          The firmware version of this storage controller.
    
    - name: Manufacturer
      type: string
      flags:
          - readonly
      description: >
          The manufacturer of this storage controller.

    - name: Model
      type: string
      flags:
          - readonly
      description: >
          The model number for the storage controller.

    - name: SKU
      type: string
      flags:
          - readonly
      description: >
          The SKU for this storage controller.
          
    - name: SerialNumber
      type: string
      flags:
          - readonly
      description: >
          The serial number for this storage controller.
          
    - name: PartNumber
      type: string
      flags:
          - readonly
      description: >
          The part number for this storage controller
          
    - name: AssetTag
      type: string
      flags:
          - readonly
      description: >
          The user-assigned asset tag for this storage controller.
          
    - name: SupportedControllerProtocols
      type: array[string]
      flags:
          - readonly
      description: >
          The supported set of protocols for communicating with this storage controller.
          
    - name: SupportedDeviceProtocols
      type: array[string]
      flags:
          - readonly
      description: >
          The protocols that the storage controller can use to communicate with attached devices.
          
    - name: SupportedRAIDTypes
      type: array[string]
      flags:
          - readonly
      description: >
          The set of RAID types supported by the storage controller.
          
    - name: PCIeInterface
      type: dict[string,variant[string,uint64]]
      flags:
          - readonly
      description: >
          The number of PCIe lanes in use by this device.
          
    - name: TotalCacheSizeMiB
      type: uint64
      flags:
          - readonly
      description: >
          The total configured cache memory, measured in MiB.
          
    - name: PersistentCacheSizeMiB
      type: uint64
      flags:
          - readonly
      description: >
          The portion of the cache memory that is persistent, measured in MiB.
          
    - name: CacheSummaryState
      type: string
      flags:
          - readonly
      description: >
          State of the cachecsummary.
          
    - name: CacheSummaryHealth
      type: string
      flags:
          - readonly
      description: >
          Health of the cachecsummary
          
    - name: Identifiers
      type: array[dict[string,string]]
      flags:
          - readonly
      description: >
          Any additional identifiers for a resource.
          
    - name: ControllerRates
      type: dict[string,uint64]
      flags:
          - readonly
      description: >
          This property describes the various controller rates used for processes such as volume rebuild or consistency checks.
          
    - name: NVMeControllerProperties
      type: dict[string,variant[string,uint64]]
      flags:
          - readonly
      description: >
          The maximum individual queue size that an NVMe I/O controller supports.
    

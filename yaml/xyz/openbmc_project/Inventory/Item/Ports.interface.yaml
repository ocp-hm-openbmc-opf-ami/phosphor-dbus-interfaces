description: >
    The Port schema contains properties that describe a port of a switch, 
    controller, chassis, or any other device that could be 
    connected to another entity.
properties:
    - name: Name
      type: string
      flags:
          - readonly
      description: >
          The name of the resource or array member.
    - name: Id
      type: string
      flags:
          - readonly
      description: >
          The unique identifier for this resource within the 
          collection of similar resources.
    - name: Description
      type: string
      flags:
          - readonly
      description: >
          Implementation form for the USBController Port device..
    - name: ActiveWidth
      type: uint16
      flags:
          - readonly
      description: >
          The number of active lanes for this interface.
    - name: CurrentSpeedGbps
      type: uint16
      flags:
          - readonly
      description: >
          The current speed of this port..
    - name: InterfaceEnabled
      type: boolean
      flags:
          - readonly
      description: >
          An indication of whether the port is enabled..
    - name: LinkTransitionIndicator
      type: uint16
      flags:
          - readonly
      description: >
          The number of link state transitions for this interface..
    - name: LocationIndicatorActive
      type: boolean
      flags:
          - readonly
      description: >
          An indicator allowing an operator to physically 
          locate this resource.
    - name: Links
      type: array[string]
      flags:
          - readonly
      description: >
          Links for the PCIeDevices..
    - name: MaxFrameSize
      type: uint16
      flags:
          - readonly
      description: >
          The maximum frame size supported by the port.
    - name: MaxSpeedGbps
      type: uint16
      flags:
          - readonly
      description: >
          The maximum speed of this port as currently configured.
    - name: PortId
      type: string
      flags:
          - readonly
      description: >
          The label of this port on the physical package for this port.
    - name: SignalDetected
      type: string
      flags:
          - readonly
      description: >
          An indication of whether a signal is detected on this interface.
    - name: LinkNetworkTechnology
      type: string
      flags:
          - readonly
      description: >
          The link network technology capabilities of this port.
    - name: PortMedium
      type: string
      flags:
          - readonly
      description: >
          The physical connection medium for this port.
    - name: PortProtocol
      type: string
      flags:
          - readonly
      description: >
          The protocol being sent over this port.
    - name: PortType
      type: string
      flags:
          - readonly
      description: >
          The type of this port.
    - name: LinkState
      type: string
      flags:
          - readonly
      description: >
          The desired link state for this interface.
    - name: LinkStatus
      type: string
      flags:
          - readonly
      description: >
          The link status for this interface.
    - name: State
      type: string
      flags:
          - readonly
      description: >
          The State of the Port.
    - name: Health
      type: string
      flags:
          - readonly
      description: >
          Health of the Port.
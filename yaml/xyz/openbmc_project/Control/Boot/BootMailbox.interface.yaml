      description: >
          Mailbox block 2 lower
    - name: Mailbox2U
      type: uint64
      description: >
          Mailbox block 2 upper
    - name: Mailbox3L
      type: uint64
      description: >
          Mailbox block 3 lower
    - name: Mailbox3U
      type: uint64
      description: >
          Mailbox block 3 upper
    - name: Mailbox4L
      type: uint64
      description: >
          Mailbox block 4 lower
    - name: Mailbox4U
      type: uint64
      description: >
          Mailbox block 4 upper

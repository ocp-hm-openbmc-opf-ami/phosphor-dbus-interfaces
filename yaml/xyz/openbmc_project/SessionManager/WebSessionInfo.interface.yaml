description: >
    WEB session information and represents properties and 
    methods for managing WEB session.

methods:
    - name: WebSessionRegister
      description: >
          This dbus method adds WEB session information. 
      parameters:
          - name: sessionId
            type: byte
            description: >
                 It’s a unique ID which will be generated by session management.
                 server must set it to 0 as default value. 
          - name: ipAdress
            type: string
            description: >
                 IP Address of the remote machine from where BMC is accessed 
          - name: userName
            type: string
            description: >
                 Name of the user who is trying to access.
          - name: sessionType
            type: byte
            description: >
                 session type 
          - name: previlage
            type: byte
            description: >
                 User Privilege
          - name: userId
            type: byte
            description: >
                 userId 
      returns:
          - name: rsp
            type: boolean
            description: >
                 success or failure
                 
    - name: WebSessionUnregister
      description: >
          This is the dbus method to unregister/delete session information.
      parameters:
          - name: sessionId
            type: byte
            description: >
                 session Id which to unregister. 
          - name: sessionType
            type: byte
            description: >
                 Type of Session(WEB = 1).
          - name: reason
            type: byte
            description: >
                 reason for unregister/delete.
      returns:
          - name: rsp
            type: boolean
            description: >
                 success or failure

properties:
    - name: WebSessionInfo
      type: array[struct[byte, string, string, byte, byte, byte]] 
      flags:
          - readonly
      description: >
          All logged-in WEB session information is stored.

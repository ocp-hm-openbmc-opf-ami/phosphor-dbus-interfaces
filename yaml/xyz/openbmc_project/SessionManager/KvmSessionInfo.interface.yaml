description: >
    KVM session information and represents properties and 
    methods for managing KVM session.

methods:
    - name: KvmSessionRegister
      description: >
          This dbus method adds KVM session information. 
      parameters:
          - name: sessionId
            type: byte
            description: >
                 It’s a unique ID which will be generated by session management.
                 server must set it to 0 as default value. 
          - name: ipAdress
            type: string
            description: >
                 IP Address of the remote machine from where BMC is accessed 
          - name: userName
            type: string
            description: >
                 Name of the user who is trying to access.
          - name: sessionType
            type: byte
            description: >
                 session type 
          - name: previlage
            type: byte
            description: >
                 User Privilege
          - name: userId
            type: byte
            description: >
                 userId 
      returns:
          - name: rsp
            type: boolean
            description: >
                 success or failure
                 
    - name: KvmSessionUnregister
      description: >
          This is the dbus method to unregister/delete session information.
      parameters:
          - name: sessionId
            type: byte
            description: >
                 session Id which to unregister. 
          - name: sessionType
            type: byte
            description: >
                 Type of Session(KVM = 0).
          - name: reason
            type: byte
            description: >
                 reason for unregister/delete.
      returns:
          - name: rsp
            type: boolean
            description: >
                 success or failure

    - name: ClearAll
      description: >
          This dbus method delete all logged-in KVM session.
      returns:
          - name: rsp
            type: boolean
            description: >
                 success or failure

properties:
    - name: KvmSessionInfo
      type: array[struct[byte, string, string, byte, byte, byte]] 
      flags:
          - readonly
      description: >
          All logged-in KVM session information is stored.
